<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音短视频去水印工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-image: url("https://i.ibb.co/sdyvb2ND/wd.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 32px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 8px;
            color: #222;
        }
        .tip {
            text-align: center;
            color: #555;
            font-size: 13px;
            margin-bottom: 24px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color .2s;
        }
        input:focus { border-color: #fe2c55; }
        button {
            padding: 0 22px;
            background: #fe2c55;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: filter .2s;
            white-space: nowrap;
        }
        button:hover { filter: brightness(0.95); }
        button:disabled { background: #ccc; cursor: not-allowed; filter: none; }
        .result {
            margin-top: 20px;
            display: none;
        }
        .media-box video {
            width: 100%;
            border-radius: 10px;
            background: #000;
        }
        .image-box {
            width: 100%;
        }
        .image-box img {
            width: 100%;
            border-radius: 10px;
            display: block;
        }
        .image-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
        }
        .image-nav button {
            padding: 6px 16px;
            font-size: 13px;
        }
        .image-nav span {
            font-size: 13px;
            color: #555;
            min-width: 50px;
            text-align: center;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .actions a {
            flex: 1;
            text-align: center;
            padding: 10px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
        }
        .btn-copy { background: #06b6d4; }
        .btn-download { background: #10b981; }
        .toggle-btn {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            background: #3b82f6;
            color: #fff;
            transition: background .2s;
        }
        .toggle-btn.active {
            background: #93c5fd;
            color: #1e40af;
        }
        .error {
            color: #e0264a;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #444;
            display: none;
        }
        .debug-box {
            margin-top: 12px;
            padding: 12px;
            background: rgba(246, 248, 250, 0.8);
            border-radius: 8px;
            font-size: 12px;
            color: #333;
            word-break: break-all;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }
        .notice {
            margin-top: 24px;
            padding: 12px;
            background: rgba(255, 248, 225, 0.8);
            border-radius: 8px;
            font-size: 12px;
            color: #997404;
            line-height: 1.6;
        }
    </style>
</head>
